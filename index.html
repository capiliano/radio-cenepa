<!DOCTYPE html>
<html lang="es">

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radio Cenepa | En Vivo</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {
    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: #ffffff;

    overflow: hidden;

    background: #020806;
}


/* =====================================================
   FONDO ANIMADO
===================================================== */

.fondo {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: -10;

    background:
        radial-gradient(
            circle at center,
            #0b1b12 0%,
            #030a06 55%,
            #010403 100%
        );
}

.luz {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
}

.luz1 {
    width: 500px;
    height: 500px;
    left: -100px;
    top: 5%;
    background: #0c9d56;
    opacity: .27;

    animation:
        movimiento1
        16s
        ease-in-out
        infinite alternate;
}

.luz2 {
    width: 600px;
    height: 600px;
    right: -150px;
    top: -100px;
    background: #08743e;
    opacity: .25;

    animation:
        movimiento2
        20s
        ease-in-out
        infinite alternate;
}

.luz3 {
    width: 420px;
    height: 420px;
    left: 35%;
    bottom: -220px;
    background: #20c976;
    opacity: .18;

    animation:
        movimiento3
        18s
        ease-in-out
        infinite alternate;
}

.luz4 {
    width: 300px;
    height: 300px;
    right: 25%;
    top: 35%;
    background: #36e28b;
    opacity: .12;

    animation:
        movimiento4
        22s
        ease-in-out
        infinite alternate;
}

@keyframes movimiento1 {

    0% {
        transform:
            translate(-50px,-20px)
            scale(1);
    }

    50% {
        transform:
            translate(180px,100px)
            scale(1.25);
    }

    100% {
        transform:
            translate(80px,280px)
            scale(.9);
    }
}

@keyframes movimiento2 {

    0% {
        transform:
            translate(80px,-50px)
            scale(1);
    }

    50% {
        transform:
            translate(-180px,130px)
            scale(1.3);
    }

    100% {
        transform:
            translate(-60px,300px)
            scale(.85);
    }
}

@keyframes movimiento3 {

    0% {
        transform:
            translate(-100px,50px)
            scale(.8);
    }

    50% {
        transform:
            translate(100px,-100px)
            scale(1.25);
    }

    100% {
        transform:
            translate(260px,20px)
            scale(1);
    }
}

@keyframes movimiento4 {

    0% {
        transform:
            translate(0,0)
            scale(1);
    }

    50% {
        transform:
            translate(-150px,100px)
            scale(1.4);
    }

    100% {
        transform:
            translate(150px,-80px)
            scale(.8);
    }
}

.fondo::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            transparent 15%,
            rgba(0,0,0,.25) 55%,
            rgba(0,0,0,.78) 100%
        );
}


/* =====================================================
   PANTALLA
===================================================== */

.pantalla {

    width: 100vw;
    height: 100vh;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 25px;
}


/* =====================================================
   REPRODUCTOR
===================================================== */

.reproductor {

    width:
        min(1250px,94vw);

    aspect-ratio:
        16 / 9;

    max-height:
        92vh;

    position:
        relative;

    display:
        grid;

    grid-template-columns:
        29% 38% 25%;

    align-items:
        center;

    gap:
        4%;

    padding:
        4.5%;

    overflow:
        hidden;

    border-radius:
        35px;

    background:
        linear-gradient(
            145deg,
            rgba(17,36,25,.95),
            rgba(4,12,8,.97)
        );

    border:
        1px solid
        rgba(75,170,111,.28);

    box-shadow:
        0 40px 120px
        rgba(0,0,0,.72),

        0 0 90px
        rgba(29,190,105,.08);

    backdrop-filter:
        blur(12px);
}

.reproductor::before {

    content: "";

    position: absolute;

    top: 0;

    left: 8%;

    right: 8%;

    height: 1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(82,229,145,.8),
            transparent
        );
}


/* =====================================================
   CARÁTULA
===================================================== */

.caratula {

    width: 100%;

    aspect-ratio:
        1 / 1;

    overflow: hidden;

    position: relative;

    border-radius: 28px;

    background: #07120c;

    border:
        1px solid
        rgba(90,180,124,.32);

    box-shadow:
        0 30px 65px
        rgba(0,0,0,.6);

    transition:
        .5s ease;
}

.caratula:hover {
    transform:
        scale(1.02);
}

.caratula img {

    width: 100%;
    height: 100%;

    object-fit: cover;

    display: block;
}

.caratula::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.12),
            transparent 30%,
            transparent 70%,
            rgba(0,0,0,.3)
        );
}


/* =====================================================
   INFORMACIÓN
===================================================== */

.informacion {
    width: 100%;
    text-align: center;
}


/* =====================================================
   EN VIVO
===================================================== */

.badge {

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 9px;

    padding:
        8px 15px;

    border-radius:
        50px;

    background:
        rgba(46,210,124,.08);

    border:
        1px solid
        rgba(60,220,137,.28);

    color:
        #63e79d;

    font-size:
        10px;

    font-weight:
        bold;

    letter-spacing:
        1.5px;
}

.punto {

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background:
        #39dc87;

    box-shadow:
        0 0 0 4px
        rgba(57,220,135,.10),

        0 0 14px
        rgba(57,220,135,.8);

    animation:
        pulsar 1.5s infinite;
}

@keyframes pulsar {

    0%,
    100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: .35;
        transform: scale(.75);
    }
}


/* =====================================================
   TITULO
===================================================== */

.informacion h1 {

    margin-top:
        20px;

    margin-bottom:
        8px;

    font-size:
        clamp(30px,3.7vw,50px);

    line-height:
        1;

    letter-spacing:
        -1px;
}

.programa {

    color:
        #b5c7bc;

    font-size:
        13px;

    margin-bottom:
        24px;
}


/* =====================================================
   ECUALIZADOR
===================================================== */

.barra-ondas {

    width:
        78%;

    max-width:
        360px;

    height:
        58px;

    margin:
        0 auto 22px;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        4px;

    position:
        relative;
}

.barra-ondas::after {

    content: "";

    position:
        absolute;

    left: 0;
    right: 0;

    top: 50%;

    height: 1px;

    background:
        rgba(57,220,135,.15);
}

.onda {

    width:
        4px;

    height:
        5px;

    border-radius:
        10px;

    background:
        linear-gradient(
            to top,
            #0b854a,
            #58e99b
        );

    opacity:
        .4;

    transform-origin:
        center;

    animation:
        ecualizador
        .8s
        ease-in-out
        infinite;

    animation-play-state:
        paused;
}

.reproductor.reproduciendo
.onda {

    animation-play-state:
        running;

    opacity:
        .95;
}

.onda:nth-child(1)  { animation-duration:.62s; }
.onda:nth-child(2)  { animation-duration:.82s; }
.onda:nth-child(3)  { animation-duration:.53s; }
.onda:nth-child(4)  { animation-duration:.94s; }
.onda:nth-child(5)  { animation-duration:.67s; }
.onda:nth-child(6)  { animation-duration:.99s; }
.onda:nth-child(7)  { animation-duration:.57s; }
.onda:nth-child(8)  { animation-duration:.78s; }
.onda:nth-child(9)  { animation-duration:.49s; }
.onda:nth-child(10) { animation-duration:.88s; }
.onda:nth-child(11) { animation-duration:.55s; }
.onda:nth-child(12) { animation-duration:.74s; }
.onda:nth-child(13) { animation-duration:.61s; }
.onda:nth-child(14) { animation-duration:.93s; }
.onda:nth-child(15) { animation-duration:.65s; }
.onda:nth-child(16) { animation-duration:.84s; }
.onda:nth-child(17) { animation-duration:.54s; }
.onda:nth-child(18) { animation-duration:.89s; }
.onda:nth-child(19) { animation-duration:.69s; }
.onda:nth-child(20) { animation-duration:.79s; }
.onda:nth-child(21) { animation-duration:.59s; }

@keyframes ecualizador {

    0% {
        height: 5px;
    }

    20% {
        height: 26px;
    }

    40% {
        height: 50px;
    }

    60% {
        height: 17px;
    }

    80% {
        height: 37px;
    }

    100% {
        height: 5px;
    }
}


/* =====================================================
   CONTROLES
===================================================== */

.controles {

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    gap:
        17px;
}


/* =====================================================
   PLAY
===================================================== */

.boton-play {

    width:
        74px;

    height:
        74px;

    border:
        1px solid
        rgba(110,240,166,.4);

    border-radius:
        50%;

    background:
        linear-gradient(
            145deg,
            #42e491,
            #0d7543
        );

    color:
        white;

    cursor:
        pointer;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    font-size:
        24px;

    font-weight:
        bold;

    padding-left:
        4px;

    box-shadow:
        0 18px 45px
        rgba(32,193,112,.28),

        inset 0 1px 0
        rgba(255,255,255,.25);

    transition:
        .25s ease;
}

.boton-play:hover {

    transform:
        translateY(-2px)
        scale(1.06);

    box-shadow:
        0 22px 50px
        rgba(32,193,112,.4);
}

.boton-play:active {
    transform: scale(.96);
}

.boton-play.reproduciendo {
    padding-left: 0;
}


/* =====================================================
   VOLUMEN
===================================================== */

.volumen {

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    gap:
        9px;
}

.boton-volumen {

    width:
        31px;

    height:
        31px;

    border:
        none;

    background:
        transparent;

    color:
        #9aaba2;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    cursor:
        pointer;

    transition:
        color .25s ease,
        transform .25s ease;
}

.boton-volumen:hover {

    color:
        #4de394;

    transform:
        scale(1.12);
}

.boton-volumen svg {

    width:
        20px;

    height:
        20px;

    fill:
        currentColor;

    stroke:
        currentColor;

    stroke-width:
        1.7;

    stroke-linecap:
        round;

    stroke-linejoin:
        round;
}

.onda-volumen {
    fill: none;
}


/* =====================================================
   BARRA VOLUMEN
===================================================== */

.volumen input {

    width:
        115px;

    height:
        4px;

    appearance:
        none;

    -webkit-appearance:
        none;

    background:
        rgba(255,255,255,.13);

    border-radius:
        10px;

    outline:
        none;

    cursor:
        pointer;
}

.volumen input::-webkit-slider-thumb {

    appearance:
        none;

    -webkit-appearance:
        none;

    width:
        13px;

    height:
        13px;

    border-radius:
        50%;

    background:
        #45df8d;

    box-shadow:
        0 0 10px
        rgba(69,223,141,.5);

    cursor:
        pointer;
}

.volumen input::-moz-range-thumb {

    width:
        13px;

    height:
        13px;

    border:
        none;

    border-radius:
        50%;

    background:
        #45df8d;

    box-shadow:
        0 0 10px
        rgba(69,223,141,.5);

    cursor:
        pointer;
}


/* =====================================================
   ESTADO
===================================================== */

.estado {

    margin-top:
        14px;

    color:
        #66766e;

    font-size:
        10px;
}


/* =====================================================
   GALERÍA
===================================================== */

.galeria {

    width:
        100%;

    aspect-ratio:
        3 / 4;

    position:
        relative;

    overflow:
        hidden;

    border-radius:
        26px;

    background:
        #07120c;

    border:
        1px solid
        rgba(80,150,106,.25);

    box-shadow:
        0 25px 60px
        rgba(0,0,0,.6);
}

.foto {

    position:
        absolute;

    inset:
        0;

    width:
        100%;

    height:
        100%;

    object-fit:
        cover;

    opacity:
        0;

    transform:
        scale(1.08);

    transition:
        opacity 1.5s ease,
        transform 6s ease;
}

.foto.activa {

    opacity:
        1;

    transform:
        scale(1);
}

.galeria::before {

    content: "";

    position:
        absolute;

    z-index:
        5;

    left:
        0;

    top:
        0;

    width:
        65%;

    height:
        100%;

    background:
        linear-gradient(
            90deg,
            #0b1811 0%,
            rgba(11,24,17,.94) 20%,
            rgba(11,24,17,.55) 50%,
            transparent 100%
        );

    pointer-events:
        none;
}

.galeria::after {

    content: "";

    position:
        absolute;

    inset:
        0;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.05),
            transparent 35%,
            rgba(0,0,0,.25)
        );

    z-index:
        6;
}


/* =====================================================
   INDICADORES
===================================================== */

.indicador {

    position:
        absolute;

    z-index:
        20;

    bottom:
        13px;

    right:
        13px;

    display:
        flex;

    gap:
        5px;
}

.indicador span {

    width:
        5px;

    height:
        5px;

    border-radius:
        50%;

    background:
        rgba(255,255,255,.4);

    transition:
        .3s;
}

.indicador span.activo {

    width:
        17px;

    border-radius:
        5px;

    background:
        #45df8d;

    box-shadow:
        0 0 9px
        rgba(69,223,141,.5);
}


/* =====================================================
   REDES
===================================================== */

.redes {

    position:
        absolute;

    left:
        4.5%;

    bottom:
        5%;

    display:
        flex;

    align-items:
        center;

    gap:
        9px;

    z-index:
        50;
}

.redes-titulo {

    color:
        #63736a;

    font-size:
        9px;

    text-transform:
        uppercase;

    letter-spacing:
        1.5px;

    margin-right:
        4px;
}

.red {

    width:
        34px;

    height:
        34px;

    border-radius:
        50%;

    display:
        flex;

    align-items:
        center;

    justify-content:
        center;

    text-decoration:
        none;

    color:
        white;

    font-size:
        13px;

    font-weight:
        bold;

    border:
        1px solid
        rgba(255,255,255,.13);

    background:
        rgba(255,255,255,.055);

    backdrop-filter:
        blur(8px);

    transition:
        transform .25s ease,
        background .25s ease,
        border .25s ease,
        box-shadow .25s ease;
}

.red:hover {

    transform:
        translateY(-4px)
        scale(1.08);

    background:
        rgba(53,217,133,.18);

    border-color:
        rgba(70,225,143,.45);

    box-shadow:
        0 8px 25px
        rgba(30,200,110,.18);
}

.red svg {

    width:
        17px;

    height:
        17px;

    fill:
        currentColor;
}


/* =====================================================
   MÓVIL
===================================================== */

@media(max-width:700px) {

    body {
        overflow: auto;
    }

    .pantalla {

        height: auto;

        min-height: 100vh;

        padding: 12px;
    }

    .reproductor {

        width:
            100%;

        max-height:
            none;

        aspect-ratio:
            auto;

        display:
            flex;

        flex-direction:
            column;

        gap:
            22px;

        padding:
            20px;

        border-radius:
            27px;
    }

    .caratula {

        width:
            min(78vw,320px);
    }

    .informacion {
        width: 100%;
    }

    .galeria {

        width:
            min(58vw,230px);
    }

    .redes {

        position:
            static;

        justify-content:
            center;

        width:
            100%;

        margin-top:
            -5px;

        padding-bottom:
            3px;
    }
}


/* =====================================================
   MÓVIL PEQUEÑO
===================================================== */

@media(max-width:420px) {

    .reproductor {

        padding:
            17px;

        gap:
            18px;
    }

    .caratula {

        width:
            min(72vw,260px);
    }

    .informacion h1 {

        font-size:
            30px;
    }

    .boton-play {

        width:
            66px;

        height:
            66px;
    }

    .galeria {

        width:
            55vw;
    }

    .red {

        width:
            32px;

        height:
            32px;
    }
}

</style>

</head>

<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const radio =
document.getElementById("radio");

const playButton =
document.getElementById("playButton");

const volumen =
document.getElementById("volumen");

const estado =
document.getElementById("estado");

const reproductor =
document.getElementById("reproductor");

const botonVolumen =
document.getElementById("botonVolumen");

const iconoVolumen =
document.getElementById("iconoVolumen");


/* =====================================================
   VOLUMEN
===================================================== */

radio.volume = 0.9;

let volumenAnterior = 0.9;


/* =====================================================
   ICONO VOLUMEN
===================================================== */

function actualizarIconoVolumen() {

    const nivel =
        radio.volume;


    if (nivel === 0) {

        iconoVolumen.innerHTML = `

            <path
            d="M3 9v6h4l5 4V5L7 9H3z">
            </path>

            <path
            d="M16 9l5 6">
            </path>

            <path
            d="M21 9l-5 6">
            </path>

        `;

    }

    else if (nivel < 0.5) {

        iconoVolumen.innerHTML = `

            <path
            d="M3 9v6h4l5 4V5L7 9H3z">
            </path>

            <path
            class="onda-volumen"
            d="M16 9a4 4 0 0 1 0 6">
            </path>

        `;

    }

    else {

        iconoVolumen.innerHTML = `

            <path
            d="M3 9v6h4l5 4V5L7 9H3z">
            </path>

            <path
            class="onda-volumen"
            d="M16 8.5a5 5 0 0 1 0 7">
            </path>

            <path
            class="onda-volumen"
            d="M18.5 6a8.5 8.5 0 0 1 0 12">
            </path>

        `;

    }

}


/* =====================================================
   BARRA VOLUMEN
===================================================== */

volumen.addEventListener(
    "input",
    function() {

        radio.volume =
            parseFloat(this.value);

        if (
            radio.volume > 0
        ) {

            volumenAnterior =
                radio.volume;

        }

        actualizarIconoVolumen();

    }
);


/* =====================================================
   SILENCIAR
===================================================== */

botonVolumen.addEventListener(
    "click",
    function() {

        if (
            radio.volume > 0
        ) {

            volumenAnterior =
                radio.volume;

            radio.volume =
                0;

            volumen.value =
                0;

        }

        else {

            radio.volume =
                volumenAnterior || 0.9;

            volumen.value =
                radio.volume;

        }

        actualizarIconoVolumen();

    }
);


/* =====================================================
   PLAY
===================================================== */

async function controlarRadio() {

    if (
        radio.paused
    ) {

        try {

            await radio.play();

            playButton.textContent =
                "■";

            playButton.classList.add(
                "reproduciendo"
            );

            reproductor.classList.add(
                "reproduciendo"
            );

            estado.textContent =
                "";

        }

        catch(error) {

            console.log(error);

            estado.textContent =
                "No se pudo conectar con la señal.";

        }

    }

    else {

        radio.pause();

        radio.load();

        playButton.textContent =
            "▶";

        playButton.classList.remove(
            "reproduciendo"
        );

        reproductor.classList.remove(
            "reproduciendo"
        );

        estado.textContent =
            "Presiona ▶ para escuchar la transmisión.";

    }

}


/* =====================================================
   REPRODUCCIÓN
===================================================== */

radio.addEventListener(
    "playing",
    function() {

        playButton.textContent =
            "■";

        playButton.classList.add(
            "reproduciendo"
        );

        reproductor.classList.add(
            "reproduciendo"
        );

        estado.textContent =
            "";

    }
);


/* =====================================================
   PAUSA
===================================================== */

radio.addEventListener(
    "pause",
    function() {

        playButton.textContent =
            "▶";

        playButton.classList.remove(
            "reproduciendo"
        );

        reproductor.classList.remove(
            "reproduciendo"
        );

        estado.textContent =
            "Presiona ▶ para escuchar la transmisión.";

    }
);


/* =====================================================
   CARRUSEL
===================================================== */

const fotos =
document.querySelectorAll(".foto");

const indicadores =
document.querySelectorAll(".indicador span");

let fotoActual = 0;


function cambiarFoto() {

    fotos[
        fotoActual
    ].classList.remove(
        "activa"
    );

    indicadores[
        fotoActual
    ].classList.remove(
        "activo"
    );

    fotoActual++;


    if (
        fotoActual >=
        fotos.length
    ) {

        fotoActual = 0;

    }


    fotos[
        fotoActual
    ].classList.add(
        "activa"
    );

    indicadores[
        fotoActual
    ].classList.add(
        "activo"
    );

}


setInterval(
    cambiarFoto,
    5000
);


/* =====================================================
   PRECARGAR FOTOS
===================================================== */

fotos.forEach(
    function(foto) {

        const imagen =
            new Image();

        imagen.src =
            foto.src;

    }
);


/* =====================================================
   TECLA ESPACIO
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.code ===
            "Space"
        ) {

            event.preventDefault();

            controlarRadio();

        }

    }
);


/* =====================================================
   INICIAR ICONO
===================================================== */

actualizarIconoVolumen();

</script>
