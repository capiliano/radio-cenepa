<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#06100b">

<link rel="icon" type="image/png" href="./favicon.png">

<title>Radio Cenepa | En Vivo</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
}

body {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: white;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 10% 20%,
            rgba(40, 210, 120, .18),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 70%,
            rgba(20, 160, 90, .16),
            transparent 30%
        ),
        #06100b;
}


/* =====================================================
   FONDO ANIMADO
===================================================== */

body::before,
body::after {

    content: "";

    position: fixed;

    width: 450px;

    height: 450px;

    border-radius: 50%;

    filter: blur(100px);

    opacity: .25;

    pointer-events: none;

    z-index: -1;
}

body::before {

    background: #20c878;

    top: -180px;

    left: -120px;

    animation:
        movimientoVerde 12s ease-in-out infinite alternate;
}

body::after {

    background: #0c7d45;

    right: -150px;

    bottom: -180px;

    animation:
        movimientoVerde2 15s ease-in-out infinite alternate;
}

@keyframes movimientoVerde {

    from {
        transform: translate(0, 0) scale(1);
    }

    to {
        transform: translate(220px, 180px) scale(1.25);
    }
}

@keyframes movimientoVerde2 {

    from {
        transform: translate(0, 0) scale(1);
    }

    to {
        transform: translate(-180px, -160px) scale(1.3);
    }
}


/* =====================================================
   PANTALLA
===================================================== */

.pantalla {

    width: 100vw;

    height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 25px;
}


/* =====================================================
   REPRODUCTOR PC
===================================================== */

.reproductor {

    width: min(1200px, 94vw);

    aspect-ratio: 16 / 9;

    max-height: 90vh;

    position: relative;

    display: grid;

    grid-template-columns:
        31% 38% 25%;

    align-items: center;

    gap: 3%;

    padding: 4%;

    overflow: hidden;

    border-radius: 30px;

    border:
        1px solid rgba(80, 180, 120, .35);

    background:
        linear-gradient(
            145deg,
            rgba(20, 40, 30, .94),
            rgba(7, 18, 12, .96)
        );

    box-shadow:
        0 35px 100px rgba(0,0,0,.58),
        inset 0 1px 0 rgba(255,255,255,.04);
}


/* =====================================================
   CARÁTULA
===================================================== */

.caratula {

    width: 100%;

    aspect-ratio: 1 / 1;

    overflow: hidden;

    border-radius: 25px;

    border:
        1px solid #315b44;

    box-shadow:
        0 25px 55px rgba(0,0,0,.5);
}

.caratula img {

    width: 100%;

    height: 100%;

    display: block;

    object-fit: cover;
}


/* =====================================================
   INFORMACIÓN
===================================================== */

.informacion {

    width: 100%;

    text-align: center;
}


/* =====================================================
   EN VIVO
===================================================== */

.badge {

    display: inline-flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    padding: 8px 14px;

    border-radius: 50px;

    background:
        rgba(39,202,120,.10);

    border:
        1px solid rgba(39,202,120,.30);

    color:
        #50dc91;

    font-size: 11px;

    font-weight: bold;

    letter-spacing: .8px;
}

.punto {

    width: 9px;

    height: 9px;

    border-radius: 50%;

    background:
        #2bd27d;

    box-shadow:
        0 0 0 5px rgba(43,210,125,.10);

    animation:
        pulsar 1.5s infinite;
}

@keyframes pulsar {

    0%,100% {
        opacity: 1;
    }

    50% {
        opacity: .35;
    }
}


/* =====================================================
   TITULO
===================================================== */

.informacion h1 {

    font-size:
        clamp(27px,3.5vw,46px);

    margin-top: 20px;

    margin-bottom: 7px;

    line-height: 1.1;

    color:
        white;
}

.programa {

    color:
        white;

    font-size: 14px;

    margin-bottom: 20px;
}


/* =====================================================
   ECUALIZADOR
===================================================== */

.barra-ondas {

    width: 70%;

    max-width: 350px;

    height: 55px;

    margin:
        0 auto 8px;

    display: flex;

    align-items: flex-end;

    justify-content: center;

    gap: 4px;

    border-bottom:
        2px solid rgba(57,217,132,.35);

    padding-bottom: 2px;
}

.onda {

    width: 4px;

    height: 7px;

    border-radius:
        5px 5px 0 0;

    background:
        #39d984;

    opacity: .45;

    transform-origin:
        bottom center;

    animation:
        ecualizador .8s ease-in-out infinite;

    animation-play-state:
        paused;
}

.reproductor.reproduciendo
.onda {

    animation-play-state:
        running;
}


/* Diferentes velocidades */

.onda:nth-child(1) { animation-duration:.65s; }
.onda:nth-child(2) { animation-duration:.85s; }
.onda:nth-child(3) { animation-duration:.55s; }
.onda:nth-child(4) { animation-duration:.95s; }
.onda:nth-child(5) { animation-duration:.70s; }
.onda:nth-child(6) { animation-duration:1s; }
.onda:nth-child(7) { animation-duration:.60s; }
.onda:nth-child(8) { animation-duration:.80s; }
.onda:nth-child(9) { animation-duration:.50s; }
.onda:nth-child(10) { animation-duration:.90s; }
.onda:nth-child(11) { animation-duration:.55s; }
.onda:nth-child(12) { animation-duration:.75s; }
.onda:nth-child(13) { animation-duration:.60s; }
.onda:nth-child(14) { animation-duration:.95s; }
.onda:nth-child(15) { animation-duration:.65s; }
.onda:nth-child(16) { animation-duration:.85s; }
.onda:nth-child(17) { animation-duration:.55s; }
.onda:nth-child(18) { animation-duration:.90s; }
.onda:nth-child(19) { animation-duration:.70s; }
.onda:nth-child(20) { animation-duration:.80s; }
.onda:nth-child(21) { animation-duration:.60s; }


@keyframes ecualizador {

    0% {
        height: 6px;
        opacity: .45;
    }

    20% {
        height: 22px;
        opacity: .70;
    }

    40% {
        height: 48px;
        opacity: 1;
    }

    60% {
        height: 18px;
        opacity: .65;
    }

    80% {
        height: 35px;
        opacity: .85;
    }

    100% {
        height: 6px;
        opacity: .45;
    }
}


/* =====================================================
   CONTROLES
===================================================== */

.controles {

    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 17px;
}


/* =====================================================
   BOTON PLAY
===================================================== */

.boton-play {

    width: 70px;

    height: 70px;

    border: none;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #2acb79,
            #107342
        );

    color: white;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 24px;

    font-weight: bold;

    padding-left: 4px;

    box-shadow:
        0 12px 35px
        rgba(34,190,112,.28);

    transition:
        transform .2s,
        box-shadow .2s;
}

.boton-play:hover {

    transform:
        scale(1.06);

    box-shadow:
        0 15px 40px
        rgba(34,190,112,.4);
}

.boton-play.reproduciendo {

    padding-left: 0;
}


/* =====================================================
   VOLUMEN
===================================================== */

.volumen {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 10px;

    color:
        #a8b5ad;
}

.volumen-icono {

    font-size: 18px;

    opacity: .9;
}

.volumen input {

    width: 115px;

    accent-color:
        #2acb79;
}


/* =====================================================
   CARRUSEL
===================================================== */

.galeria {

    width: 100%;

    aspect-ratio: 3 / 4;

    position: relative;

    overflow: hidden;

    border-radius: 22px;

    background:
        #0b1811;

    box-shadow:
        0 20px 45px
        rgba(0,0,0,.5);
}

.foto {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

    opacity: 0;

    transform:
        scale(1.05);

    transition:
        opacity 1.5s ease,
        transform 6s ease;
}

.foto.activa {

    opacity: 1;

    transform:
        scale(1);
}

.galeria::before {

    content: "";

    position: absolute;

    z-index: 5;

    left: 0;

    top: 0;

    width: 55%;

    height: 100%;

    background:
        linear-gradient(
            90deg,
            #0d1d14 0%,
            rgba(13,29,20,.92) 25%,
            rgba(13,29,20,.55) 55%,
            transparent 100%
        );

    pointer-events:
        none;
}


/* =====================================================
   INDICADORES
===================================================== */

.indicador {

    position: absolute;

    z-index: 20;

    bottom: 10px;

    right: 10px;

    display: flex;

    gap: 4px;
}

.indicador span {

    width: 5px;

    height: 5px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.35);

    transition: .3s;
}

.indicador span.activo {

    width: 15px;

    background:
        #45d88a;
}


/* =====================================================
   REDES SOCIALES
===================================================== */

.redes {

    position: absolute;

    bottom: 5%;

    left: 4%;

    display: flex;

    align-items: center;

    gap: 8px;
}

.red {

    width: 35px;

    height: 35px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 50%;

    color: white;

    text-decoration: none;

    font-size: 14px;

    font-weight: bold;

    background:
        rgba(255,255,255,.07);

    border:
        1px solid rgba(255,255,255,.10);

    transition:
        transform .2s,
        background .2s;
}

.red:hover {

    transform:
        translateY(-3px);

    background:
        rgba(43,210,125,.25);
}


/* =====================================================
   OCULTAMOS ESTADO
===================================================== */

.estado {

    display: none;
}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width:700px) {

    body {

        overflow:
            auto;

        min-height:
            100vh;
    }

    .pantalla {

        width: 100%;

        min-height: 100vh;

        height: auto;

        padding:
            20px 16px 25px;

        align-items:
            flex-start;
    }


    /* -----------------------------------------------
       REPRODUCTOR MOVIL
    ----------------------------------------------- */

    .reproductor {

        width: 100%;

        max-width: 430px;

        aspect-ratio: auto;

        min-height:
            calc(100vh - 40px);

        display: flex;

        flex-direction:
            column;

        align-items:
            center;

        justify-content:
            flex-start;

        gap: 0;

        padding:
            28px 18px 22px;

        border-radius:
            28px;

        background:
            linear-gradient(
                145deg,
                rgba(18,39,28,.94),
                rgba(6,17,11,.97)
            );
    }


    /* -----------------------------------------------
       TITULO ARRIBA
    ----------------------------------------------- */

    .informacion {

        display:
            contents;
    }

    .badge {

        order: 1;

        margin-bottom:
            12px;
    }

    .informacion h1 {

        order: 2;

        font-size:
            28px;

        margin:
            0 0 20px;

        letter-spacing:
            .5px;
    }

    .programa {

        display:
            none;
    }


    /* -----------------------------------------------
       CARATULA
    ----------------------------------------------- */

    .caratula {

        order: 3;

        width:
            min(78vw, 310px);

        max-width:
            310px;

        border-radius:
            24px;

        margin-bottom:
            25px;

        box-shadow:
            0 20px 50px rgba(0,0,0,.55);
    }


    /* -----------------------------------------------
       ONDAS
    ----------------------------------------------- */

    .barra-ondas {

        order: 4;

        width:
            82%;

        max-width:
            330px;

        height:
            58px;

        margin:
            0 auto 22px;

        gap:
            4px;
    }


    /* -----------------------------------------------
       CONTROLES
    ----------------------------------------------- */

    .controles {

        order: 5;

        width: 100%;

        gap:
            18px;
    }


    .boton-play {

        width:
            72px;

        height:
            72px;

        font-size:
            25px;
    }


    .volumen {

        width:
            100%;

        max-width:
            270px;

        gap:
            10px;
    }

    .volumen input {

        width:
            190px;
    }


    /* -----------------------------------------------
       CARRUSEL OCULTO EN MOVIL
    ----------------------------------------------- */

    .galeria {

        display:
            none;
    }


    /* -----------------------------------------------
       REDES ABAJO
    ----------------------------------------------- */

    .redes {

        position:
            static;

        order:
            6;

        width:
            100%;

        justify-content:
            center;

        margin-top:
            auto;

        padding-top:
            28px;

        gap:
            12px;
    }

    .red {

        width:
            42px;

        height:
            42px;

        font-size:
            15px;
    }

}


/* =====================================================
   CELULARES MUY PEQUEÑOS
===================================================== */

@media(max-width:380px) {

    .pantalla {

        padding:
            12px;
    }

    .reproductor {

        padding:
            22px 15px 18px;
    }

    .caratula {

        width:
            min(74vw, 270px);
    }

    .informacion h1 {

        font-size:
            25px;
    }

    .barra-ondas {

        width:
            90%;
    }

    .redes {

        padding-top:
            20px;
    }

}


/* =====================================================
   TABLETS
===================================================== */

@media(min-width:701px) and (max-width:1000px) {

    .reproductor {

        width:
            94vw;

        padding:
            4%;
    }

    .redes {

        left:
            4%;
    }

}

</style>

</head>

<script>

/* =====================================================
   ELEMENTOS
===================================================== */

const radio =
document.getElementById("radio");

const playButton =
document.getElementById("playButton");

const volumen =
document.getElementById("volumen");

const reproductor =
document.getElementById("reproductor");


/* =====================================================
   VOLUMEN
===================================================== */

radio.volume = 0.9;


volumen.addEventListener(
    "input",
    function() {

        radio.volume =
            this.value;

    }
);


/* =====================================================
   PLAY / PAUSA
===================================================== */

async function controlarRadio() {

    if (radio.paused) {

        try {

            await radio.play();

            playButton.textContent =
                "■";

            playButton.classList.add(
                "reproduciendo"
            );

            reproductor.classList.add(
                "reproduciendo"
            );

        }

        catch(error) {

            console.error(
                "Error al conectar con la radio:",
                error
            );

        }

    }

    else {

        radio.pause();

        radio.load();

        playButton.textContent =
            "▶";

        playButton.classList.remove(
            "reproduciendo"
        );

        reproductor.classList.remove(
            "reproduciendo"
        );

    }

}


/* =====================================================
   CARRUSEL
===================================================== */

const fotos =
document.querySelectorAll(".foto");

const indicadores =
document.querySelectorAll(".indicador span");

let fotoActual = 0;


function cambiarFoto() {

    if (!fotos.length)
        return;

    fotos[
        fotoActual
    ].classList.remove(
        "activa"
    );

    indicadores[
        fotoActual
    ].classList.remove(
        "activo"
    );


    fotoActual++;


    if (
        fotoActual >=
        fotos.length
    ) {

        fotoActual = 0;

    }


    fotos[
        fotoActual
    ].classList.add(
        "activa"
    );

    indicadores[
        fotoActual
    ].classList.add(
        "activo"
    );

}


setInterval(
    cambiarFoto,
    5000
);


/* =====================================================
   DETECTAR ERROR DE RADIO
===================================================== */

radio.addEventListener(
    "error",
    function() {

        playButton.textContent =
            "▶";

        playButton.classList.remove(
            "reproduciendo"
        );

        reproductor.classList.remove(
            "reproduciendo"
        );

    }
);

</script>
